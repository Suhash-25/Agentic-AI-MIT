<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082119" />
      <stop offset="100%" stop-color="#17523f" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ec291" />
      <stop offset="100%" stop-color="#237a57" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#e59f14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2e9e70" stroke-width="1.5" />

  <!-- Orbiting Solar Ray Accents -->
  <circle cx="32" cy="32" r="22" stroke="#38b18a" stroke-width="1" stroke-dasharray="3 4" opacity="0.4" />

  <!-- Botanical Leaf Element -->
  <path
    d="M32 14 C44 14 50 24 48 36 C42 44 32 46 22 42 C18 36 20 22 32 14 Z"
    fill="url(#leafGrad)"
    opacity="0.9"
  />

  <!-- Central Solar Core with Glow -->
  <circle cx="32" cy="32" r="8.5" fill="url(#sunGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.8" />

  <!-- Dynamic Energy Turbine Blade / Vector -->
  <path
    d="M32 32 L44 26 C41 21 35 22 32 32 Z"
    fill="#ffffff"
    opacity="0.75"
  />
  <path
    d="M32 32 L22 40 C25 44 31 42 32 32 Z"
    fill="#ffffff"
    opacity="0.6"
  />

  <!-- Subtle Bottom Sparkle -->
  <circle cx="46" cy="46" r="2" fill="#55cfa8" opacity="0.8" />
  <circle cx="18" cy="20" r="1.5" fill="#fcd34d" opacity="0.8" />
</svg>
